<script>
'use strict';
const data=JSON.parse(document.getElementById('data').textContent);
const lookup=id=>document.getElementById(id);
const workload=lookup('workload');
const selector=lookup('profile');
const number=value=>Number.isFinite(value)?value.toLocaleString('en-US',{maximumFractionDigits:2}):'—';
const code=value=>'<code>'+value+'</code>';
const display=value=>value.replaceAll('_',' ');
const view=()=>location.hash==='#safety'?'safety':'features';
function table(headers,rows,firstNumeric){
  return '<thead><tr>'+headers.map((value,i)=>'<th scope="col" class="'+(i>=firstNumeric?'number':'')+'">'+value+'</th>').join('')+'</tr></thead><tbody>'+
    rows.map(row=>'<tr>'+row.map((value,i)=>'<td class="'+(i>=firstNumeric?'number':'')+'">'+value+'</td>').join('')+'</tr>').join('')+'</tbody>';
}
function schema(){
  const row=data.profiles[Number(selector.value)];
  lookup('schema').textContent=row.schema;
  lookup('plan').textContent=row.status==='rejected'?row.reason:
    [row.route,'Stack limit '+row.stack_limit+' B',row.cpu,row.quant_active?'active QPS':'',
      row.emits_pext?'BMI2 PEXT code emitted':''].filter(Boolean).join(' · ');
  const cases=data.tuning.filter(item=>item.group===row.group&&item.profile===row.profile);
  lookup('calibration').innerHTML=cases.length?'<p>Calibration results for this profile</p>'+
    '<div class="scroll" tabindex="0" role="region" aria-label="Calibration results"><table>'+
    table(['Workload','Operation','ns / record','Frame B','Object B'],cases.map(item=>[
      display(item.workload),data.captions[item.operation]??display(item.operation),number(item.ns),number(item.mean_wire_bytes),
      number(item.object_bytes)]),2)+'</table></div>':'';
}
function render(){
  const safety=view()==='safety';
  const selected=workload.value;
  const rows=(safety?data.safety:data.winners).filter(row=>selected==='all'||row.workload===selected);
  if(safety){
    const times=['checked_read','trusted_read','validate','validate_then_trusted','checked_write','trusted_write','validate_values'];
    lookup('results').innerHTML=table(['Workload','Profile',...times.map(op=>data.captions[op]+' (ns)'),'Read ratio'],
      rows.map(row=>[display(row.workload),code(row.profile),...times.map(op=>number(row[op])),'<strong>'+number(row.readRatio)+'×</strong>']),2);
    lookup('additional').replaceChildren();
  }else{
    lookup('results').innerHTML=table(['Workload','Operation','Selected profile','ns / record','Frame B','Object B'],
      rows.map(row=>[display(row.workload),data.captions[row.operation],code(row.profile),'<strong>'+number(row.ns)+'</strong>',number(row.mean_wire_bytes),number(row.object_bytes)]),3);
    const extra=data.extras.filter(row=>selected==='all'||row.workload===selected);
    lookup('additional').innerHTML=extra.length?'<h2>Native, cache and slot paths</h2><div class="scroll" tabindex="0" role="region" aria-label="Native, cache and slot paths"><table>'+
      table(['Workload','Operation','Profile','ns / record'],extra.map(row=>[display(row.workload),data.captions[row.operation]??display(row.operation),code(row.profile),number(row.ns)]),3)+'</table></div>':'';
  }
}
function switchSection(){
  const safety=view()==='safety';
  lookup('title').textContent=safety?'Safety QSL':'QSL All Features';
  lookup('description').textContent=safety?
    'Same schema and frame for every checked/trusted pair. Trusted paths receive previously validated inputs.':
    'Fastest calibration candidate for each operation. Times come from two later passes on a separate set of records.';
  lookup('method').textContent=safety?'Safety methodology':'Feature sweep and methodology';
  lookup('method').href=safety?'QSL-SAFETY.md':'QSL-ALL-FEATURES.md';
  lookup('csv').href='results/qsl-matrix/'+(safety?'safety.csv':'confirmed.csv');
  for(const name of ['features','safety']){
    const link=lookup(name+'-link');
    if(name===view())link.setAttribute('aria-current','page');else link.removeAttribute('aria-current');
  }
  workload.replaceChildren(new Option('All workloads','all'));
  for(const name of [...new Set((safety?data.safety:data.winners).map(row=>row.workload))]){
    workload.add(new Option(display(name),name));
  }
  render();
}
for(const [i,row] of data.profiles.entries())selector.add(new Option(row.group+' / '+row.profile,i));
selector.addEventListener('change',schema);
workload.addEventListener('change',render);
window.addEventListener('hashchange',switchSection);
switchSection();
schema();
</script>
