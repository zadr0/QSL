[package]
name = "qsl-optimized-bench"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
qsl = { version = "=0.4.0", default-features = false, features = ["alloc"] }
qsl-realistic-bench = { path = "../realistic" }
prost = "=0.14.4"
capnp = { version = "=0.27.3", features = ["unaligned"] }
bincode = { version = "=2.0.1", features = ["derive"] }
serde_json = "=1.0.154"

[build-dependencies]
qsl = "=0.4.0"
capnpc = "=0.27.0"

[dev-dependencies]
criterion = { version = "=0.8.2", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "comparison"
harness = false

[profile.release]
lto = "thin"
codegen-units = 1
debug = 1

