[package]
name="qsl-protocol-comparison"
version="0.1.0"
edition="2021"
publish=false
[dependencies]
qsl={path="../../qsl"}
capnp={version="=0.27.3",features=["unaligned"]}
flatbuffers={version="=25.12.19"}
prost={version="=0.14.4"}
tonic={version="=0.14.9"}
tonic-prost={version="=0.14.9"}
tokio={version="=1.54.1",features=["rt", "net", "sync", "time"]}
tokio-stream={version="=0.1.19",features=["net"]}
bincode={version="=2.0.1",features=["derive"]}
serde={version="=1.0.229",features=["derive"]}
serde_json="=1.0.154"
xxhash-rust={version="=0.8.15",default-features=false,features=["xxh3"]}
[build-dependencies]
qsl={path="../../qsl"}
capnpc="=0.27.0"
tonic-prost-build="=0.14.9"
protoc-bin-vendored="=3.3.0"
[dev-dependencies]
criterion={version="=0.8.2",default-features=false,features=["cargo_bench_support"]}
[[bench]]
name="comparison"
harness=false
[profile.release]
debug=true
codegen-units=1
lto="thin"
