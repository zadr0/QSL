[package]
name="qsl-no-allocator-check"
version="0.0.0"
edition="2021"
publish=false
[workspace]
resolver="2"
[dependencies]
qsl-core={path="../..",default-features=false,features=["diagnostics"]}
qsl-rt={path="../../../qsl-rt",default-features=false}
qsl={path="../../../qsl",default-features=false}
[build-dependencies]
qsl={path="../../../qsl",default-features=false,features=["compiler","macros"]}
qsl-interpreter={path="../../../qsl-interpreter"}
[profile.dev]
panic="abort"
[profile.release]
panic="abort"

[[bin]]
name="qsl-no-allocator-check"
path="src/main.rs"
test=false
bench=false
