[package]
name = "qsl-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
license = "MIT"
authors = ["Arsa"]
description = "Shared schema contracts and portable runtime foundations for QSL binary codecs."
repository = "https://github.com/zadr0/QSL"
homepage = "https://zadr0.github.io/QSL/"
documentation = "https://docs.rs/qsl-core"
readme = "README.md"
keywords = ["serialization", "binary", "schema", "protocol"]
categories = ["encoding"]
publish = ["crates-io"]
include = ["src/**", "Cargo.toml", "Cargo.lock", "README.md", "CHANGELOG.md", "LICENSE"]

[package.metadata.docs.rs]
all-features = true

[features]
default = []
diagnostics = []
[dependencies]
xxhash-rust = { version = "=0.8.15", default-features = false, features = ["xxh3"] }
