[package]
name = "qsl-core"
version = "0.2.0"
edition = "2021"
rust-version = "1.98"
license = "MIT"
authors = ["Arsa"]
description = "no_std runtime with optional alloc for QSL binary codecs."
repository = "https://github.com/zadr0/QSL"
homepage = "https://zadr0.github.io/QSL/"
documentation = "https://docs.rs/qsl-core"
readme = "README.md"
keywords = ["serialization", "binary", "schema", "protocol"]
categories = ["encoding"]
publish = ["crates-io"]
include = ["src/**", "Cargo.toml", "Cargo.lock", "README.md", "CHANGELOG.md", "LICENSE", "tests/no-alloc/**"]

[package.metadata.docs.rs]
all-features = true

[features]
default = ["alloc"]
diagnostics = []
alloc = []
[dependencies]
xxhash-rust = { version = "=0.8.15", default-features = false, features = ["xxh3"] }
