[package]
name = "qsl-interpreter"
version = "0.3.0"
description = "Specialized Rust binary codec generation for QSL schemas and explicit data layouts."
edition = "2021"
rust-version = "1.98"
license = "MIT"
authors = ["Arsa"]
repository = "https://github.com/zadr0/QSL"
homepage = "https://zadr0.github.io/QSL/"
documentation = "https://docs.rs/qsl-interpreter"
publish = ["crates-io"]
readme = "README.md"
keywords = ["serialization", "binary", "schema", "codegen"]
categories = ["encoding", "development-tools::build-utils"]
include = ["src/**", "tests/**", "docs/OPTIONAL_V2.md", "Cargo.toml", "Cargo.lock", "README.md", "CHANGELOG.md", "LICENSE"]

[package.metadata.docs.rs]
all-features = true

[features]
default = []
rust-macros = ["qsl-lexer/rust-macros"]
[dependencies]
qsl-lexer = { version = "=0.3.0", path = "../qsl-lexer" }
