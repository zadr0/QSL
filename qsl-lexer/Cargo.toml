[package]
name = "qsl-lexer"
version = "0.1.0"
description = "QSL schema lexer, parser and deterministic build-time analysis."
edition = "2021"
rust-version = "1.98"
license = "MIT"
authors = ["Arsa"]
repository = "https://github.com/zadr0/QSL"
documentation = "https://docs.rs/qsl-lexer"
publish = ["crates-io"]
readme = "README.md"
keywords = ["serialization", "binary", "schema", "codegen"]
categories = ["encoding"]
include = ["src/**", "tests/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE"]

[package.metadata.docs.rs]
all-features = true

[features]
default = []
rust-macros = ["dep:syn"]
[dependencies]
xxhash-rust = { version = "=0.8.15", default-features = false, features = ["xxh3"] }
syn = { version = "=2.0.119", optional = true, default-features = false, features = ["full", "parsing"] }
