[package]
name = "qsl-lexer"
version = "0.3.0"
description = "Schema lexer, parser and build-time analysis for QSL binary serialization."
edition = "2021"
rust-version = "1.98"
license = "MIT"
authors = ["Arsa"]
repository = "https://github.com/zadr0/QSL"
homepage = "https://zadr0.github.io/QSL/"
documentation = "https://docs.rs/qsl-lexer"
publish = ["crates-io"]
readme = "README.md"
keywords = ["serialization", "binary", "schema", "codegen"]
categories = ["encoding", "parser-implementations"]
include = ["src/**", "tests/**", "proofs/**", "Cargo.toml", "Cargo.lock", "README.md", "CHANGELOG.md", "LICENSE"]

[package.metadata.docs.rs]
all-features = true

[features]
default = []
rust-macros = ["dep:syn"]
[dependencies]
qsl-core = { version = "=0.1.0", path = "../qsl-core" }
syn = { version = "=2.0.119", optional = true, default-features = false, features = ["full", "parsing"] }
