[package]
name="qsl-strings-bench"
version="0.0.0"
edition="2021"
publish=false
[dependencies]
qsl={path="../../qsl"}
[build-dependencies]
qsl-interpreter={path="../../qsl-interpreter"}
[dev-dependencies]
criterion={version="=0.8.2",default-features=false,features=["cargo_bench_support"]}
[[bench]]
name="strings"
path="bench.rs"
harness=false
[profile.release]
lto="thin"
codegen-units=1
debug=true
[workspace]
