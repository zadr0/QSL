[package]
name="qsl-rt"
version = "0.1.0"
edition="2021"
rust-version="1.98"
license="MIT"
publish = ["crates-io"]
description="no_std static storage providers implementing qsl-core contracts"
authors = ["Arsa"]
repository = "https://github.com/zadr0/QSL"
homepage = "https://zadr0.github.io/QSL/"
documentation = "https://docs.rs/qsl-rt"
readme = "README.md"
keywords = ["serialization", "binary", "schema", "no-std"]
categories = ["encoding", "no-std"]
include = ["src/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE"]
[dependencies]
qsl-core={path="../qsl-core",version="=0.2.0",default-features=false}
